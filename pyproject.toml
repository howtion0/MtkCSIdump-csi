[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ax3000t-csi-localization"
version = "0.1.0"
description = "Evidence-gated coarse localization experiments for AX3000T CSI2 captures"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = [
    "build==1.6.0",
    "pytest>=8",
    "ruff==0.16.5",
]

[project.scripts]
ax3000t-localize = "localization.cli:main"

[tool.setuptools]
packages = ["localization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Stage 1/2 intentionally preserve their upstream Python/driver formatting.
# Stage 3 gates every new localization module and test without mechanically
# rewriting those already-audited historical files.
extend-exclude = [
    "csi_protocol.py",
    "csi_udp_client_gui.py",
    "driver/mt7915-csi/tests/verify.py",
]
